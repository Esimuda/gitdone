# GitDone pipeline.
# This file cannot run in the current environment. It is written from GitLab's
# stable SAST and secret-detection templates, the release: keyword docs, and the
# Google Cloud Run component tutorial (component pin @0.1.0).
# The Cloud Run component project was archived when these docs were checked.
# The pin matches the tutorial. Whether that tag still resolves is unverified.
#
# Placeholders — set these in Settings > CI/CD > Variables, or replace the
# values below, before a deploy can succeed:
#   GCP_PROJECT_ID          Google Cloud project id
#   GCP_REGION              Cloud Run region, for example us-central1
#   GCP_AR_LOCATION         Artifact Registry location, for example us-central1
#   GCP_AR_REPOSITORY       Artifact Registry repository id
#   CLOUD_RUN_SERVICE_STAGING
#   CLOUD_RUN_SERVICE_PRODUCTION
#   STAGING_SERVICE_URL     https URL of the staging Cloud Run service
#   PRODUCTION_SERVICE_URL  https URL of the production Cloud Run service
#   ROLLBACK_WINDOW_MINUTES   optional, default 5
#   ROLLBACK_MAX_ERROR_RATE   optional, default 0.02
#   ROLLBACK_ISSUE_IID        optional, the ship issue to reopen if the guard fires
#   GCP_DEPLOY              set to "true" once Google Cloud is connected. Until
#                           then the Google components are not included and the
#                           publish, deploy, smoke and rollback jobs are skipped,
#                           so lint, test, build, SAST and secret detection
#                           still run green.
#
# Authentication to Google is Workload Identity Federation, not a JSON key.
# Configure it in the GitLab project (Settings > Integrations > Google Cloud)
# so jobs receive short-lived credentials. The Cloud Run component expects that
# integration. Grant the workload identity roles/run.admin and
# roles/iam.serviceAccountUser, plus Artifact Registry writer for the copy.
# The rollback guard also needs roles/monitoring.viewer to read request counts.
# Docs: https://docs.gitlab.com/ci/cloud_services/google_cloud/
#       https://docs.gitlab.com/tutorials/create_and_deploy_web_service_with_google_cloud_run_component/

stages:
  - lint
  - test
  - package
  - publish
  - deploy-staging
  - verify
  - deploy-production
  - monitor
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  IMAGE_TAG: $CI_COMMIT_SHA
  GCP_PROJECT_ID: "REPLACE_WITH_GCP_PROJECT_ID"
  GCP_REGION: "us-central1"
  GCP_AR_LOCATION: "us-central1"
  GCP_AR_REPOSITORY: "REPLACE_WITH_AR_REPOSITORY"
  CLOUD_RUN_SERVICE_STAGING: "REPLACE_WITH_STAGING_SERVICE"
  CLOUD_RUN_SERVICE_PRODUCTION: "REPLACE_WITH_PRODUCTION_SERVICE"
  AR_IMAGE: "$GCP_AR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_AR_REPOSITORY/gitdone"
  DOCKER_TLS_CERTDIR: "/certs"

.default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.gcp-deploy:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_DEPLOY == "true"

.node:
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci

lint:
  extends: .node
  stage: lint
  script:
    - npm run lint
    - npm run typecheck

unit:
  extends: .node
  stage: test
  script:
    - npm test

# Image tag tracks @playwright/test. Bump both together.
e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - npm run test:e2e

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # Smoke and rollback jobs use identity: google_cloud, which GitLab rejects
  # while the Google Cloud IAM integration is off, so they live in their own
  # file and are only included once GCP_DEPLOY is "true".
  - local: ci/gcp-deploy.gitlab-ci.yml
    rules:
      - if: $GCP_DEPLOY == "true"
  - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@0.1.0
    rules:
      - if: $GCP_DEPLOY == "true"
    inputs:
      stage: publish
      source: $CI_REGISTRY_IMAGE:$IMAGE_TAG
      target: $AR_IMAGE:$IMAGE_TAG
  - component: gitlab.com/google-gitlab-components/cloud-run/deploy-cloud-run@0.1.0
    rules:
      - if: $GCP_DEPLOY == "true"
    inputs:
      stage: deploy-staging
      as: deploy-staging
      image: $AR_IMAGE:$IMAGE_TAG
      project_id: $GCP_PROJECT_ID
      region: $GCP_REGION
      service: $CLOUD_RUN_SERVICE_STAGING
  - component: gitlab.com/google-gitlab-components/cloud-run/deploy-cloud-run@0.1.0
    rules:
      - if: $GCP_DEPLOY == "true"
    inputs:
      stage: deploy-production
      as: deploy-production
      image: $AR_IMAGE:$IMAGE_TAG
      project_id: $GCP_PROJECT_ID
      region: $GCP_REGION
      service: $CLOUD_RUN_SERVICE_PRODUCTION

# Builds on merge request pipelines too, so the flow's Package stage can record
# the image for the exact commit it verified. Only main moves :latest.
package:
  stage: package
  image: docker:27
  services:
    - name: docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - echo "gitdone-package image=$CI_REGISTRY_IMAGE:$IMAGE_TAG"

# Every merge to main publishes a GitLab Release with the CI job token.
# The flow's token (ai_workflows scope) can read releases but cannot create them,
# so the pipeline publishes and the Release stage reads the result.
# The notes are the merged MR description, read from the public API.
# Only merge commits release, so direct pushes to main do not.
release:notes:
  stage: release
  image: node:22-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /See merge request/
  needs:
    - job: package
  script:
    - node scripts/release-notes.mjs
  artifacts:
    paths:
      - release-notes.md
    reports:
      dotenv: release.env

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /See merge request/
  needs:
    - job: release:notes
      artifacts: true
  script:
    - echo "Publishing $RELEASE_TAG for $CI_COMMIT_SHA"
  release:
    tag_name: $RELEASE_TAG
    name: "GitDone $RELEASE_TAG"
    description: ./release-notes.md
    ref: $CI_COMMIT_SHA
